name: Goal Compass validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse browser and server JavaScript
        run: node scripts/check.mjs
